env = GDK_BACKEND,wayland,x11
env = CLUTTER_BACKEND,wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = XWAYLAND_NO_GLAMOUR,1
env = WLR_DRM_NO_ATOMIC,1

env = HYPRCURSOR_THEME,breeze

source=~/.config/hypr/themes/macchiato.conf

monitor=DP-1,1920x1080@144,0x0,1
monitor=HDMI-A-1,1920x1080@72,1920x0,1
monitor=,preferred,auto,1

$mod = SUPER
workspace= 1, monitor:DP-1, default:true
workspace= 10, monitor:HDMI-A-1, default:true
# scale apps
exec-once = xprop -root -f _XWAYLAND_GLOBAL_OUTPUT_SCALE 32c -set _XWAYLAND_GLOBAL_OUTPUT_SCALE 2
exec-once = eww open back
exec-once = hyprpaper
exec-once = systemctl --usert start hyprpolkitagent
exec-once = udiskie

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  # enable Variable Frame Rate
  vrr = 1
# disable auto polling for config file changes
  # disable_autoreload = 1
  focus_on_activate = 1
  enable_swallow = true
  swallow_regex = ^((s|S)team|(A|a)lacritty|(k|K)itty|Minecraft Launcher|(t|T)mux)$
}
# touchpad gestures
gestures {
  workspace_swipe_forever = 1
}
input {
  kb_layout = us,de
  kb_options = grp:alt_space_toggle
  # focus change on cursor move
  follow_mouse = 1
  accel_profile = flat
  touchpad {
    scroll_factor = 0.3
  }
}
general {
  gaps_in = 3
  gaps_out = 5
  border_size = 3
  col.active_border = $mauve
  col.inactive_border = $surface0
}
decoration {
  rounding = 10
}
animations {
  enabled = 1
  animation = border, 1, 2, default
  animation = fade, 1, 4, default
  animation = windows, 1, 3, default, popin 80%
  animation = workspaces, 1, 2, default, slide
}
dwindle {
  # keep floating dimentions while tiling
  preserve_split = 1
}
windowrule = match:class ^(Minecraft Launcher)$, tile 1
windowrule = match:class ^(pavucontrol)$, float 1
# telegram media viewer
windowrule = match:title ^(Media viewer)$, float 1
# make Firefox PiP window floating and sticky
windowrule = match:title ^(Picture-in-Picture)$, float 1
windowrule = match:title ^(Picture-in-Picture)$, pin 1
# throw sharing indicators away
windowrule = match:title ^(Firefox — Sharing Indicator)$, workspace special silent
windowrule = match:title ^(.*is sharing (your screen|a window)\.)$, workspace special silent
# start spotify tiled in ws9
windowrule = match:class ^(Spotify)$, tile 1
windowrule = match:class ^(Spotify)$, workspace 9 silent
# start Discord/WebCord in ws2
windowrule = match:title ^(.*(Disc|WebC)ord.*)$, workspace 8
# idle inhibit while watching videos
windowrule = match:class ^(mpv)$, idle_inhibit focus
windowrule = match:class ^(firefox)$, idle_inhibit fullscreen
# mouse movements
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindm = $mod ALT, mouse:272, resizewindow
# compositor commands
bind = $mod SHIFT, Q, exec, pkill Hyprland
bind = $mod, C, killactive,
bind = $mod, F, fullscreen,
bind = $mod, G, togglegroup,
bind = $mod SHIFT, N, changegroupactive, f
bind = $mod SHIFT, P, changegroupactive, b
# bind = $mod, R, togglesplit,
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod ALT, ,resizeactive,
# toggle "monocle" (no_gaps_when_only)
$kw = dwindle:no_gaps_when_only
# bind = $mod, M, exec, hyprctl keyword $kw $(($(hyprctl getoption $kw -j | jaq -r '.int') ^ 1))
# utility
# wofi
bindr = $mod, SUPER_L, exec, /home/severin/.scripts/wofi.sh
bind = $mod, BACKSPACE, exec, /home/severin/.scripts/wofi.sh
# alacritty
bind = $mod, Return, exec, alacritty
# ghostty
bind = $mod, N, exec, ghostty -e tmux new-session ~/.scripts/sessionizer.sh ~ ~/School/ ~/Programming ~/Programming/rust ~/Programming/aoc ~/Programming/assembly ~/Programming/java ~/Programming/rust/compiler ~/.dotfiles ~/.dotfiles/.config ~/Documents/ /home/ ~/Studium/
# file manager
bind = $mod, E, exec, ghostty -e yazi
bind = $mod SHIFT, E, exec, dolphin
# browser
bind = $mod, B, exec, firefox
# logout menu
bind = $mod, Escape, exec, wlogout -p layer-shell
# lock screen
bind = $mod, L, exec, loginctl lock-session
# select area to perform OCR on
bind = $mod, O, exec, wl-ocr
# move focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
# window resize
bind = $mod, S, submap, resize
submap = resize
binde = , L, resizeactive, 10 0
binde = , H, resizeactive, -10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10
bind = , escape, submap, reset
bind = $mod, S, submap, reset
submap = reset
# media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
# volume
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 6%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 6%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# backlight
bindle = , XF86MonBrightnessUp, exec, light -A 5
bindle = , XF86MonBrightnessDown, exec, light -U 5
# screenshot
# stop animations while screenshotting; makes black border go away
$screenshotarea = hyprctl keyword animation "fadeOut,0,0,default"; grimblast --notify copysave area; hyprctl keyword animation "fadeOut,1,4,default"
bind = , Print, exec, $screenshotarea
bind = $mod SHIFT, R, exec, $screenshotarea
bind = CTRL, Print, exec, grimblast --notify --cursor copysave output
bind = $mod SHIFT CTRL, R, exec, grimblast --notify --cursor copysave output
bind = ALT, Print, exec, grimblast --notify --cursor copysave screen
bind = $mod SHIFT ALT, R, exec, grimblast --notify --cursor copysave screen
# workspaces

bindp = $mod SHIFT, 1, movetoworkspace, 1
bindp = $mod SHIFT, 2, movetoworkspace, 2
bindp = $mod SHIFT, 3, movetoworkspace, 3
bindp = $mod SHIFT, 4, movetoworkspace, 4
bindp = $mod SHIFT, 5, movetoworkspace, 5
bindp = $mod SHIFT, 6, movetoworkspace, 6
bindp = $mod SHIFT, 7, movetoworkspace, 7
bindp = $mod SHIFT, 8, movetoworkspace, 8
bindp = $mod SHIFT, 9, movetoworkspace, 9
bindp = $mod SHIFT, 0, movetoworkspace, 10

bindp = $mod, 1, workspace, 1
bindp = $mod, 2, workspace, 2
bindp = $mod, 3, workspace, 3
bindp = $mod, 4, workspace, 4
bindp = $mod, 5, workspace, 5
bindp = $mod, 6, workspace, 6
bindp = $mod, 7, workspace, 7
bindp = $mod, 8, workspace, 8
bindp = $mod, 9, workspace, 9
bindp = $mod, 0, workspace, 10

# special workspace
bind = $mod SHIFT, grave, movetoworkspace, special
bind = $mod, grave, togglespecialworkspace, DP-1
# cycle workspaces
# bind = $mod, H, workspace, m-1
# bind = $mod, L, workspace, m+1
# cycle monitors
# bind = $mod SHIFT, H, focusmonitor, l
# bind = $mod SHIFT, L, focusmonitor, r

# reload workspace/bar
bind = $mod CTRL, r, exec, pkill hyprpaper; eww open back; hyprpaper
